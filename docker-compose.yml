services:
  backend:
    build:
      context: ./backend
    ports:
      - "4500:4500"
    env_file:
      - ./backend/.env
    environment:
      # These override anything in .env so they are always correct for Docker
      NODE_ENV: production
      HOST: "0.0.0.0"
      DB_PATH: /app/data/app.db
    volumes:
      - db_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the Vite bundle at build time.
        # Compose reads this from the root .env file.
        VITE_API_URL: ${VITE_API_URL}
    env_file:
      - ./frontend/.env
    ports:
      - "4501:4501"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
